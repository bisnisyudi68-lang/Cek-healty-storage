<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Xiaomi EDL Test Point PRO+</title><style>

body{
font-family:Segoe UI;
background:#f2f4f7;
margin:0;
}

.header{
background:#ff6900;
color:white;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.search{
max-width:900px;
margin:auto;
padding:20px;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.container{
max-width:900px;
margin:auto;
padding:0 20px 40px;
}

.card{
background:white;
border-radius:12px;
padding:14px;
margin-bottom:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.model{
font-weight:bold;
font-size:16px;
}

.spec{
font-size:13px;
color:#555;
margin-top:3px;
}

.img{
width:100%;
border-radius:8px;
margin-top:8px;
}

.btn{
display:inline-block;
margin-top:8px;
background:#ff6900;
color:white;
padding:6px 10px;
border-radius:6px;
font-size:12px;
text-decoration:none;
}

</style></head><body><div class="header">
Xiaomi EDL Test Point PRO+
</div><div class="search">
<input type="text" id="search" placeholder="Cari tipe Xiaomi...">
</div><div class="container" id="list"></div><script>

const edl=[

{model:"Redmi Note 13 Pro",chip:"Snapdragon 7s Gen2",mode:"EDL 9008"},
{model:"Redmi Note 12 Pro",chip:"Dimensity 1080",mode:"BROM"},
{model:"Redmi Note 11",chip:"Snapdragon 680",mode:"EDL 9008"},
{model:"Redmi Note 10 Pro",chip:"Snapdragon 732G",mode:"EDL 9008"},
{model:"Redmi Note 9",chip:"Helio G85",mode:"BROM"},

{model:"Redmi 12",chip:"Helio G88",mode:"BROM"},
{model:"Redmi 10",chip:"Helio G88",mode:"BROM"},
{model:"Redmi 9",chip:"Helio G80",mode:"BROM"},
{model:"Redmi 8",chip:"Snapdragon 439",mode:"EDL 9008"},

{model:"Poco X6 Pro",chip:"Dimensity 8300",mode:"BROM"},
{model:"Poco X5 Pro",chip:"Snapdragon 778G",mode:"EDL 9008"},
{model:"Poco X4 Pro",chip:"Snapdragon 695",mode:"EDL 9008"},
{model:"Poco X3 Pro",chip:"Snapdragon 860",mode:"EDL 9008"},

{model:"Poco F5",chip:"Snapdragon 7+ Gen2",mode:"EDL 9008"},
{model:"Poco F4",chip:"Snapdragon 870",mode:"EDL 9008"},
{model:"Poco F3",chip:"Snapdragon 870",mode:"EDL 9008"},

{model:"Redmi K60",chip:"Snapdragon 8+ Gen1",mode:"EDL 9008"},
{model:"Redmi K50",chip:"Dimensity 8100",mode:"BROM"},
{model:"Redmi K40",chip:"Snapdragon 870",mode:"EDL 9008"},

{model:"Xiaomi 14",chip:"Snapdragon 8 Gen3",mode:"EDL 9008"},
{model:"Xiaomi 13",chip:"Snapdragon 8 Gen2",mode:"EDL 9008"},
{model:"Xiaomi 12",chip:"Snapdragon 8 Gen1",mode:"EDL 9008"},
{model:"Xiaomi 11",chip:"Snapdragon 888",mode:"EDL 9008"}

];

function render(list){

const container=document.getElementById("list");
container.innerHTML="";

list.forEach(e=>{

let query=e.model.replace(/ /g,"+")+"+edl+test+point";

container.innerHTML+=`

<div class="card">

<div class="model">${e.model}</div>

<div class="spec">Chipset : ${e.chip}</div>

<div class="spec">Mode : ${e.mode}</div>

<a target="_blank"
href="https://www.google.com/search?q=${query}&tbm=isch">

<img class="img"
src="https://via.placeholder.com/600x300?text=${e.model.replace(/ /g,"+")}+Test+Point">

</a>

<a class="btn" target="_blank"
href="https://www.google.com/search?q=${query}&tbm=isch">

📷 Lihat Test Point

</a>

</div>

`;

});

}

render(edl);

document.getElementById("search").addEventListener("keyup",function(){

let q=this.value.toLowerCase();

let result=edl.filter(e=>e.model.toLowerCase().includes(q));

render(result);

});

</script></body>
</html>
