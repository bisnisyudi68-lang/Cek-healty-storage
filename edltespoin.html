function render(list){

<div class="model">${e.model}</div>

Klik tombol untuk melihat lokasi test point motherboard
</div>

href="https://www.google.com/search?q=${query}&tbm=isch">

</a>

`;

}

render(edl);

document.getElementById("search").addEventListener("keyup",function(){

let q=this.value.toLowerCase();

let result=edl.filter(e=>e.model.toLowerCase().includes(q));

render(result);

});
