<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mi Account / FRP Xiaomi</title><style>

body{
font-family:Segoe UI;
background:#f2f4f7;
margin:0;
}

.header{
background:#ff6900;
color:white;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.search{
max-width:900px;
margin:auto;
padding:20px;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.container{
max-width:900px;
margin:auto;
padding:0 20px 40px;
}

.card{
background:white;
border-radius:12px;
padding:15px;
margin-bottom:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.title{
font-weight:bold;
font-size:16px;
color:#ff6900;
margin-bottom:6px;
}

.row{
font-size:13px;
margin-top:4px;
}

.label{
font-weight:bold;
}

</style></head><body><div class="header">
Mi Account / FRP Xiaomi
</div><div class="search">
<input type="text" id="search" placeholder="Cari masalah Mi Account...">
</div><div class="container" id="list"></div><script>

const data=[

{
judul:"Mi Account Locked",
penyebab:"HP masih terhubung akun Mi sebelumnya",
solusi:"Login akun Mi lama atau unlock menggunakan server resmi"
},

{
judul:"FRP Google Lock",
penyebab:"Reset HP tanpa menghapus akun Google",
solusi:"Login akun Google sebelumnya atau bypass FRP"
},

{
judul:"Mi Account Tidak Bisa Login",
penyebab:"Server error atau password salah",
solusi:"Reset password di account.xiaomi.com"
},

{
judul:"Mi Cloud Lock",
penyebab:"Device masih terdaftar di Mi Cloud",
solusi:"Login Mi Cloud lalu remove device"
},

{
judul:"Unlock Bootloader Ditolak",
penyebab:"Akun belum diizinkan unlock",
solusi:"Request unlock di Mi Unlock Tool"
},

{
judul:"Mi Account Lupa Password",
penyebab:"Password lupa",
solusi:"Reset password melalui email / nomor HP"
},

{
judul:"Device Locked After Reset",
penyebab:"Factory reset tanpa logout Mi Account",
solusi:"Login akun Mi lama"
}

];

function render(list){

const container=document.getElementById("list");
container.innerHTML="";

list.forEach(e=>{

container.innerHTML+=`

<div class="card">

<div class="title">${e.judul}</div>

<div class="row"><span class="label">Penyebab :</span> ${e.penyebab}</div>

<div class="row"><span class="label">Solusi :</span> ${e.solusi}</div>

</div>

`;

});

}

render(data);

document.getElementById("search").addEventListener("keyup",function(){

let q=this.value.toLowerCase();

let result=data.filter(e=>e.judul.toLowerCase().includes(q));

render(result);

});

</script></body>
</html>
