<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kelebihan & Kekurangan Samsung</title><style>

body{
font-family:Segoe UI;
background:#f2f4f7;
margin:0;
}

.header{
background:#0d6efd;
color:white;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.search{
max-width:900px;
margin:auto;
padding:20px;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.container{
max-width:900px;
margin:auto;
padding:0 20px 40px;
}

.card{
background:white;
border-radius:12px;
padding:15px;
margin-bottom:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.nama{
font-weight:bold;
font-size:16px;
}

.plus{
color:#2e7d32;
font-size:13px;
margin-top:5px;
}

.minus{
color:#d32f2f;
font-size:13px;
margin-top:5px;
}

</style></head><body><div class="header">
Kelebihan & Kekurangan Samsung
</div><div class="search">
<input type="text" id="search" placeholder="Cari tipe Samsung...">
</div><div class="container" id="list"></div><script>

const phones=[

{
model:"Galaxy S24 Ultra",
plus:"Kamera 200MP, performa Snapdragon 8 Gen3 sangat cepat, layar AMOLED terbaik",
minus:"Harga sangat mahal, ukuran besar"
},

{
model:"Galaxy S23 Ultra",
plus:"Kamera sangat bagus, baterai awet, performa tinggi",
minus:"Harga masih mahal"
},

{
model:"Galaxy S22 Ultra",
plus:"Stylus S-Pen, layar sangat tajam",
minus:"Baterai kurang awet"
},

{
model:"Galaxy A55",
plus:"Build metal premium, kamera bagus, performa stabil",
minus:"Tidak ada charger di box"
},

{
model:"Galaxy A54",
plus:"Layar AMOLED bagus, kamera stabil",
minus:"Chipset kurang kuat untuk gaming berat"
},

{
model:"Galaxy A34",
plus:"Baterai awet, layar besar",
minus:"Desain agak tebal"
},

{
model:"Galaxy A24",
plus:"Harga murah, baterai besar",
minus:"Chipset standar"
},

{
model:"Galaxy A15",
plus:"Harga sangat murah, layar AMOLED",
minus:"Performa biasa saja"
},

{
model:"Galaxy M55",
plus:"Baterai besar, performa bagus",
minus:"Desain kurang premium"
},

{
model:"Galaxy M34",
plus:"Baterai sangat awet",
minus:"Body agak tebal"
},

{
model:"Galaxy Z Fold5",
plus:"Layar lipat besar, multitasking hebat",
minus:"Harga sangat mahal"
},

{
model:"Galaxy Z Flip5",
plus:"Desain unik, ringkas",
minus:"Baterai kecil"
}

];

function render(list){

const container=document.getElementById("list");
container.innerHTML="";

list.forEach(p=>{

container.innerHTML+=`

<div class="card">

<div class="nama">${p.model}</div>

<div class="plus">
Kelebihan: ${p.plus}
</div>

<div class="minus">
Kekurangan: ${p.minus}
</div>

</div>

`;

});

}

render(phones);

document.getElementById("search").addEventListener("keyup",function(){

let q=this.value.toLowerCase();

let result=phones.filter(p=>p.model.toLowerCase().includes(q));

render(result);

});

</script></body>
</html>
