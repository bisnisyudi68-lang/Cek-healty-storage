<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Secret Code Xiaomi</title><style>

body{
font-family:Segoe UI;
background:#f2f4f7;
margin:0;
}

.header{
background:#ff6900;
color:white;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.search{
max-width:900px;
margin:auto;
padding:20px;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.container{
max-width:900px;
margin:auto;
padding:0 20px 40px;
}

.card{
background:white;
border-radius:12px;
padding:14px;
margin-bottom:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.code{
font-weight:bold;
color:#ff6900;
font-size:16px;
}

.desc{
font-size:13px;
color:#444;
margin-top:4px;
}

</style></head><body><div class="header">
Secret Code Xiaomi
</div><div class="search">
<input type="text" id="search" placeholder="Cari secret code Xiaomi...">
</div><div class="container" id="list"></div><script>

const codes=[

{code:"*#06#",desc:"Cek IMEI Xiaomi"},
{code:"*#*#4636#*#*",desc:"Menu informasi jaringan dan baterai"},
{code:"*#*#6484#*#*",desc:"Hardware Test Xiaomi"},
{code:"*#*#64663#*#*",desc:"QC Test Mode"},
{code:"*#*#284#*#*",desc:"Bug report Xiaomi"},
{code:"*#*#2664#*#*",desc:"Touchscreen test"},
{code:"*#*#0588#*#*",desc:"Proximity sensor test"},
{code:"*#*#232339#*#*",desc:"Wifi test"},
{code:"*#*#232331#*#*",desc:"Bluetooth test"},
{code:"*#*#7262626#*#*",desc:"Field test mode"},
{code:"*#*#1111#*#*",desc:"FTA software version"},
{code:"*#*#2222#*#*",desc:"FTA hardware version"},
{code:"*#*#1234#*#*",desc:"Firmware information"},
{code:"*#*#1472365#*#*",desc:"GPS test"},
{code:"*#*#1575#*#*",desc:"Advanced GPS test"},
{code:"*#*#0842#*#*",desc:"Vibration test"},
{code:"*#*#0673#*#*",desc:"Audio test"},
{code:"*#*#0289#*#*",desc:"Speaker test"},
{code:"*#*#34971539#*#*",desc:"Camera information"},
{code:"*#*#273283255663282#*#*",desc:"Backup media files"}

];

function render(list){

const container=document.getElementById("list");
container.innerHTML="";

list.forEach(c=>{

container.innerHTML+=`

<div class="card">

<div class="code">${c.code}</div>

<div class="desc">${c.desc}</div>

</div>

`;

});

}

render(codes);

document.getElementById("search").addEventListener("keyup",function(){

let q=this.value.toLowerCase();

let result=codes.filter(c=>
c.code.toLowerCase().includes(q) ||
c.desc.toLowerCase().includes(q)
);

render(result);

});

</script></body>
</html>
