/* RENDER */

function render(list){

const container=document.getElementById("list");
container.innerHTML="";

list.forEach(p=>{

container.innerHTML+=`
<div class="item">
<div class="model">${p.model}</div>
<div class="code">${p.code}</div>
<div class="info">Tahun: ${p.year} | Chipset: ${p.chip}</div>
<a class="link" target="_blank" href="https://www.google.com/search?q=firmware+${p.code}">Firmware</a>
</div>
`;

});

}

render(phones);

/* SEARCH */

document.getElementById("search").addEventListener("keyup",function(){

let q=this.value.toLowerCase();

let result=phones.filter(p=>
p.model.toLowerCase().includes(q) ||
p.code.toLowerCase().includes(q)
);

render(result);

});
