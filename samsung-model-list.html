<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Database Samsung 2015-2026</title>

<style>

body{
font-family:Segoe UI;
background:#f2f4f7;
margin:0;
}

.header{
background:#0d6efd;
color:white;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.search{
max-width:900px;
margin:auto;
padding:20px;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.container{
max-width:900px;
margin:auto;
padding:0 20px 40px;
}

.item{
background:white;
padding:12px;
border-radius:10px;
margin-bottom:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.model{
font-weight:bold;
}

.code{
color:#0d6efd;
font-weight:bold;
font-size:14px;
}

.info{
font-size:13px;
color:#666;
}

.link{
display:inline-block;
margin-top:5px;
padding:4px 10px;
background:#0d6efd;
color:white;
border-radius:6px;
font-size:12px;
text-decoration:none;
}

</style>

</head>

<body>

<div class="header">
Database Samsung 2015-2026
</div>

<div class="search">
<input type="text" id="search" placeholder="Cari model atau kode Samsung...">
</div>

<div class="container" id="list"></div>

<script>

/* DATABASE MODEL */

const phones = [

{model:"Galaxy S6",code:"SM-G920",year:"2015",chip:"Exynos 7420"},
{model:"Galaxy S7",code:"SM-G930",year:"2016",chip:"Exynos 8890"},
{model:"Galaxy S8",code:"SM-G950",year:"2017",chip:"Exynos 8895"},
{model:"Galaxy S9",code:"SM-G960",year:"2018",chip:"Exynos 9810"},
{model:"Galaxy S10",code:"SM-G973",year:"2019",chip:"Exynos 9820"},
{model:"Galaxy S20",code:"SM-G980",year:"2020",chip:"Exynos 990"},
{model:"Galaxy S21",code:"SM-G991",year:"2021",chip:"Exynos 2100"},
{model:"Galaxy S22",code:"SM-S901",year:"2022",chip:"Snapdragon 8 Gen1"},
{model:"Galaxy S23",code:"SM-S911",year:"2023",chip:"Snapdragon 8 Gen2"},
{model:"Galaxy S24",code:"SM-S921",year:"2024",chip:"Snapdragon 8 Gen3"},

{model:"Galaxy A10",code:"SM-A105",year:"2019",chip:"Exynos 7884"},
{model:"Galaxy A10s",code:"SM-A107",year:"2019",chip:"Helio P22"},
{model:"Galaxy A11",code:"SM-A115",year:"2020",chip:"Snapdragon 450"},
{model:"Galaxy A12",code:"SM-A125",year:"2020",chip:"Helio P35"},
{model:"Galaxy A13",code:"SM-A135",year:"2022",chip:"Exynos 850"},
{model:"Galaxy A14",code:"SM-A145",year:"2023",chip:"Exynos 850"},
{model:"Galaxy A15",code:"SM-A155",year:"2024",chip:"Helio G99"},
{model:"Galaxy A20",code:"SM-A205",year:"2019",chip:"Exynos 7884"},
{model:"Galaxy A21",code:"SM-A215",year:"2020",chip:"Helio P35"},
{model:"Galaxy A22",code:"SM-A225",year:"2021",chip:"Helio G80"},

{model:"Galaxy M10",code:"SM-M105",year:"2019",chip:"Exynos 7870"},
{model:"Galaxy M11",code:"SM-M115",year:"2020",chip:"Snapdragon 450"},
{model:"Galaxy M12",code:"SM-M127",year:"2021",chip:"Exynos 850"},
{model:"Galaxy M13",code:"SM-M135",year:"2022",chip:"Exynos 850"},
{model:"Galaxy M14",code:"SM-M145",year:"2023",chip:"Exynos 1330"},

];

/* RENDER */

function render(list){

const container=document.getElementById("list");
container.innerHTML="";

list.forEach(p=>{

container.innerHTML+=`
<div class="item">
<div class="model">${p.model}</div>
<div class="code">${p.code}</div>
<div class="info">Tahun: ${p.year} | Chipset: ${p.chip}</div>
<a class="link" target="_blank" href="https://www.google.com/search?q=firmware+${p.code}">Firmware</a>
</div>
`;

});

}

render(phones);

/* SEARCH */

document.getElementById("search").addEventListener("keyup",function(){

let q=this.value.toLowerCase();

let result=phones.filter(p=>
p.model.toLowerCase().includes(q) ||
p.code.toLowerCase().includes(q)
);

render(result);

});

</script>

</body>
</html>
