<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Firmware Xiaomi PRO</title><style>

body{
font-family:Segoe UI;
background:#f2f4f7;
margin:0;
}

.header{
background:#ff6900;
color:white;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.search{
max-width:900px;
margin:auto;
padding:20px;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.container{
max-width:900px;
margin:auto;
padding:0 20px 40px;
}

.card{
background:white;
border-radius:12px;
padding:15px;
margin-bottom:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.model{
font-weight:bold;
font-size:16px;
}

.code{
color:#ff6900;
font-weight:bold;
font-size:14px;
}

.btn{
display:inline-block;
margin-top:8px;
margin-right:5px;
background:#ff6900;
color:white;
padding:6px 10px;
border-radius:6px;
font-size:12px;
text-decoration:none;
}

</style></head><body><div class="header">
Firmware Xiaomi PRO
</div><div class="search">
<input type="text" id="search" placeholder="Cari firmware Xiaomi...">
</div><div class="container" id="list"></div><script>

const firmware=[

{model:"Redmi Note 13 Pro",code:"2312DRA50G"},
{model:"Redmi Note 13",code:"2312DRAABG"},
{model:"Redmi Note 12",code:"22101316G"},
{model:"Redmi Note 11",code:"2201117TG"},
{model:"Redmi Note 10 Pro",code:"M2101K6G"},

{model:"Poco X6 Pro",code:"2311DRK48G"},
{model:"Poco X5 Pro",code:"22101320G"},
{model:"Poco X4 Pro",code:"2201116PG"},
{model:"Poco X3 Pro",code:"M2102J20SG"},

{model:"Poco F5",code:"23013PC75G"},
{model:"Poco F4",code:"22021211RG"},
{model:"Poco F3",code:"M2012K11AG"},

{model:"Xiaomi 14",code:"23127PN0CG"},
{model:"Xiaomi 13",code:"2211133G"},
{model:"Xiaomi 12",code:"2201123G"},
{model:"Xiaomi 11T",code:"21081111RG"}

];

function render(list){

const container=document.getElementById("list");
container.innerHTML="";

list.forEach(f=>{

container.innerHTML+=`

<div class="card">

<div class="model">${f.model}</div>

<div class="code">${f.code}</div>

<a class="btn" target="_blank"
href="https://www.google.com/search?q=${f.code}+fastboot+rom">
Fastboot ROM
</a>

<a class="btn" target="_blank"
href="https://www.google.com/search?q=${f.code}+recovery+rom">
Recovery ROM
</a>

<a class="btn" target="_blank"
href="https://www.google.com/search?q=${f.code}+miui+firmware">
MIUI Firmware
</a>

</div>

`;

});

}

render(firmware);

document.getElementById("search").addEventListener("keyup",function(){

let q=this.value.toLowerCase();

let result=firmware.filter(f=>
f.model.toLowerCase().includes(q) ||
f.code.toLowerCase().includes(q)
);

render(result);

});

</script></body>
</html>
