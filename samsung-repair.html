<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Analisa Perbaikan Samsung</title><style>

body{
font-family:Segoe UI;
background:#f2f4f7;
margin:0;
}

.header{
background:#0d6efd;
color:white;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.search{
max-width:900px;
margin:auto;
padding:20px;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.container{
max-width:900px;
margin:auto;
padding:0 20px 40px;
}

.card{
background:white;
border-radius:12px;
padding:15px;
margin-bottom:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.judul{
font-weight:bold;
font-size:16px;
margin-bottom:6px;
}

.detail{
font-size:13px;
color:#444;
margin-top:4px;
}

</style></head><body><div class="header">
Analisa Perbaikan Samsung
</div><div class="search">
<input type="text" id="search" placeholder="Cari kerusakan...">
</div><div class="container" id="list"></div><script>

const kerusakan=[

{
judul:"HP Mati Total",
detail:"Penyebab: IC Power rusak, short di jalur Vbat, baterai mati. Solusi: cek arus dengan power supply, cek jalur Vbat, ganti IC Power."
},

{
judul:"Bootloop / Restart Terus",
detail:"Penyebab: firmware rusak, eMMC bad sector. Solusi: flash firmware ulang atau ganti eMMC."
},

{
judul:"Tidak Bisa Charging",
detail:"Penyebab: konektor charger rusak, IC charging rusak. Solusi: ganti konektor charger atau cek IC charging."
},

{
judul:"Sinyal Hilang",
detail:"Penyebab: IMEI null, baseband error, IC RF rusak. Solusi: repair IMEI atau cek IC RF."
},

{
judul:"Wifi Tidak Aktif",
detail:"Penyebab: IC Wifi rusak atau firmware error. Solusi: flash firmware atau ganti IC wifi."
},

{
judul:"Bluetooth Tidak Berfungsi",
detail:"Penyebab: IC wifi/bluetooth rusak. Solusi: reball atau ganti IC."
},

{
judul:"Layar Gelap / Blank",
detail:"Penyebab: LCD rusak, IC display rusak, jalur backlight putus."
},

{
judul:"Touchscreen Tidak Berfungsi",
detail:"Penyebab: digitizer rusak atau IC touch error."
},

{
judul:"HP Cepat Panas",
detail:"Penyebab: IC CPU short atau aplikasi berat."
},

{
judul:"Tidak Ada Suara",
detail:"Penyebab: speaker rusak atau IC audio rusak."
},

{
judul:"Mic Tidak Berfungsi",
detail:"Penyebab: mic rusak atau jalur audio putus."
},

{
judul:"Kamera Tidak Bisa Dibuka",
detail:"Penyebab: modul kamera rusak atau firmware error."
},

{
judul:"HP Tidak Bisa Masuk Jaringan 4G",
detail:"Penyebab: baseband error atau setting jaringan salah."
},

{
judul:"Fingerprint Tidak Berfungsi",
detail:"Penyebab: sensor fingerprint rusak atau fleksibel putus."
},

{
judul:"HP Tidak Bisa Nyala Tapi Terbaca PC",
detail:"Penyebab: sistem crash. Solusi: flash firmware."
}

];

function render(list){

const container=document.getElementById("list");
container.innerHTML="";

list.forEach(k=>{

container.innerHTML+=`

<div class="card">

<div class="judul">${k.judul}</div>

<div class="detail">${k.detail}</div>

</div>

`;

});

}

render(kerusakan);

document.getElementById("search").addEventListener("keyup",function(){

let q=this.value.toLowerCase();

let result=kerusakan.filter(k=>k.judul.toLowerCase().includes(q));

render(result);

});

</script></body>
</html>
