<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Analisa Repair Samsung PRO</title><style>

body{
font-family:Segoe UI;
background:#f2f4f7;
margin:0;
}

.header{
background:#0d6efd;
color:white;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.search{
max-width:900px;
margin:auto;
padding:20px;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.container{
max-width:900px;
margin:auto;
padding:0 20px 40px;
}

.card{
background:white;
border-radius:12px;
padding:16px;
margin-bottom:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.judul{
font-weight:bold;
font-size:16px;
margin-bottom:6px;
}

.diagnosa{
color:#d32f2f;
font-size:13px;
margin-top:5px;
}

.perbaikan{
color:#2e7d32;
font-size:13px;
margin-top:5px;
}

</style></head><body><div class="header">
Analisa Repair Samsung PRO
</div><div class="search">
<input type="text" id="search" placeholder="Cari kerusakan teknisi...">
</div><div class="container" id="list"></div><script>

const repair=[

{
judul:"HP Mati Total",
diagnosa:"Cek arus PSU. Jika 0.00 kemungkinan jalur power putus. Jika short kemungkinan IC Power rusak.",
perbaikan:"Cek jalur Vbat, cek kapasitor short, reball atau ganti IC Power."
},

{
judul:"Short Motherboard",
diagnosa:"PSU menunjukkan arus tinggi tanpa menekan tombol power.",
perbaikan:"Cari kapasitor short menggunakan thermal atau alkohol lalu ganti."
},

{
judul:"Bootloop Samsung",
diagnosa:"HP berhenti di logo Samsung.",
perbaikan:"Flash firmware Odin atau cek eMMC."
},

{
judul:"eMMC Rusak",
diagnosa:"HP bootloop atau tidak bisa diflash.",
perbaikan:"Reprogram eMMC atau ganti eMMC."
},

{
judul:"Tidak Bisa Charging",
diagnosa:"HP tidak mengisi baterai.",
perbaikan:"Cek konektor charger, jalur VBUS, IC charging."
},

{
judul:"Sinyal Hilang",
diagnosa:"IMEI null atau baseband unknown.",
perbaikan:"Repair IMEI atau cek IC RF."
},

{
judul:"Wifi Tidak Aktif",
diagnosa:"Wifi tidak bisa dihidupkan.",
perbaikan:"Flash firmware atau ganti IC Wifi."
},

{
judul:"Bluetooth Error",
diagnosa:"Bluetooth tidak bisa aktif.",
perbaikan:"Reball IC wifi/bluetooth."
},

{
judul:"Layar Gelap",
diagnosa:"LCD menyala tapi tidak ada backlight.",
perbaikan:"Cek jalur backlight atau IC backlight."
},

{
judul:"Touchscreen Error",
diagnosa:"Touch tidak respon.",
perbaikan:"Ganti LCD atau cek IC touch."
},

{
judul:"HP Cepat Panas",
diagnosa:"HP panas walau tidak digunakan.",
perbaikan:"Cek IC CPU atau IC power."
},

{
judul:"Speaker Tidak Bunyi",
diagnosa:"Audio tidak keluar.",
perbaikan:"Ganti speaker atau cek IC audio."
},

{
judul:"Mic Tidak Berfungsi",
diagnosa:"Suara tidak terdengar saat telepon.",
perbaikan:"Ganti mic atau cek jalur audio."
},

{
judul:"Kamera Error",
diagnosa:"Camera failed.",
perbaikan:"Ganti modul kamera."
},

{
judul:"Fingerprint Error",
diagnosa:"Fingerprint tidak terdeteksi.",
perbaikan:"Ganti sensor fingerprint."
},

{
judul:"Tidak Bisa Masuk Recovery",
diagnosa:"Tombol tidak berfungsi.",
perbaikan:"Cek fleksibel tombol."
},

{
judul:"HP Tidak Terbaca PC",
diagnosa:"USB tidak terdeteksi.",
perbaikan:"Ganti konektor USB."
},

{
judul:"HP Restart Sendiri",
diagnosa:"Restart saat digunakan.",
perbaikan:"Ganti baterai atau cek IC power."
},

{
judul:"Storage Tidak Terbaca",
diagnosa:"Internal memory error.",
perbaikan:"Reball atau ganti eMMC."
},

{
judul:"GPS Tidak Berfungsi",
diagnosa:"Lokasi tidak akurat.",
perbaikan:"Cek antena GPS."
}

];

function render(list){

const container=document.getElementById("list");
container.innerHTML="";

list.forEach(r=>{

container.innerHTML+=`

<div class="card">

<div class="judul">${r.judul}</div>

<div class="diagnosa">
Diagnosa: ${r.diagnosa}
</div>

<div class="perbaikan">
Perbaikan: ${r.perbaikan}
</div>

</div>

`;

});

}

render(repair);

document.getElementById("search").addEventListener("keyup",function(){

let q=this.value.toLowerCase();

let result=repair.filter(r=>r.judul.toLowerCase().includes(q));

render(result);

});

</script></body>
</html>
