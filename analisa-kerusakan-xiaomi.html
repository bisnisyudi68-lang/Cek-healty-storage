<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Analisa Kerusakan Xiaomi PRO</title><style>

body{
font-family:Segoe UI;
background:#f2f4f7;
margin:0;
}

.header{
background:#ff6900;
color:white;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.search{
max-width:900px;
margin:auto;
padding:20px;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.container{
max-width:900px;
margin:auto;
padding:0 20px 40px;
}

.card{
background:white;
border-radius:12px;
padding:14px;
margin-bottom:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.judul{
font-weight:bold;
font-size:16px;
color:#ff6900;
}

.row{
font-size:13px;
margin-top:4px;
}

.label{
font-weight:bold;
}

</style></head><body><div class="header">
Analisa Kerusakan Xiaomi (Teknisi)
</div><div class="search">
<input type="text" id="search" placeholder="Cari kerusakan Xiaomi...">
</div><div class="container" id="list"></div><script>

const data=[

{
judul:"Xiaomi Mati Total",
penyebab:"IC Power rusak, baterai drop, short jalur Vbat",
cek:"IC Power, baterai, jalur Vbat",
solusi:"Cek tegangan baterai, cek short, ganti IC Power"
},

{
judul:"Xiaomi Bootloop",
penyebab:"Firmware rusak, update gagal, eMMC rusak",
cek:"System firmware, eMMC",
solusi:"Flash ulang firmware MIUI"
},

{
judul:"Xiaomi Stuck Logo MI",
penyebab:"System corrupt",
cek:"Partisi system",
solusi:"Flash firmware"
},

{
judul:"Xiaomi Tidak Bisa Charge",
penyebab:"IC charger rusak atau konektor USB rusak",
cek:"IC charger, konektor USB",
solusi:"Ganti konektor atau IC charger"
},

{
judul:"Xiaomi Sinyal Hilang",
penyebab:"Baseband corrupt atau IC RF rusak",
cek:"Baseband, antena, IC RF",
solusi:"Flash modem atau cek IC RF"
},

{
judul:"Xiaomi IMEI Null",
penyebab:"NVRAM rusak",
cek:"IMEI baseband",
solusi:"Repair IMEI"
},

{
judul:"Xiaomi WiFi Tidak Aktif",
penyebab:"IC WiFi rusak",
cek:"IC WiFi",
solusi:"Reball atau ganti IC"
},

{
judul:"Xiaomi Bluetooth Tidak Aktif",
penyebab:"IC combo rusak",
cek:"IC WiFi/Bluetooth",
solusi:"Reball IC"
},

{
judul:"Xiaomi Kamera Error",
penyebab:"Kamera rusak atau driver rusak",
cek:"Kamera depan / belakang",
solusi:"Ganti kamera"
},

{
judul:"Xiaomi Tidak Ada Suara",
penyebab:"Speaker rusak atau IC audio rusak",
cek:"Speaker, IC audio",
solusi:"Ganti speaker"
},

{
judul:"Xiaomi Layar Blank",
penyebab:"LCD rusak atau jalur display putus",
cek:"LCD, konektor LCD",
solusi:"Ganti LCD"
},

{
judul:"Xiaomi Restart Sendiri",
penyebab:"Baterai drop atau CPU panas",
cek:"Baterai",
solusi:"Ganti baterai"
},

{
judul:"Xiaomi Tidak Ada Getar",
penyebab:"Motor vibrator rusak",
cek:"Motor getar",
solusi:"Ganti vibrator"
},

{
judul:"Xiaomi Panas Berlebihan",
penyebab:"CPU overload atau short komponen",
cek:"CPU dan jalur power",
solusi:"Cek short"
},

{
judul:"Xiaomi Tidak Bisa Masuk Fastboot",
penyebab:"Tombol rusak atau bootloader error",
cek:"Tombol volume",
solusi:"Perbaiki tombol"
}

];

function render(list){

const container=document.getElementById("list");
container.innerHTML="";

list.forEach(e=>{

container.innerHTML+=`

<div class="card">

<div class="judul">${e.judul}</div>

<div class="row"><span class="label">Penyebab :</span> ${e.penyebab}</div>

<div class="row"><span class="label">Komponen Dicek :</span> ${e.cek}</div>

<div class="row"><span class="label">Solusi :</span> ${e.solusi}</div>

</div>

`;

});

}

render(data);

document.getElementById("search").addEventListener("keyup",function(){

let q=this.value.toLowerCase();

let result=data.filter(e=>e.judul.toLowerCase().includes(q));

render(result);

});

</script></body>
</html>
