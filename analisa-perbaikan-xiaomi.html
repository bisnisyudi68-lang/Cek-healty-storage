<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Analisa Perbaikan Xiaomi PRO</title><style>

body{
font-family:Segoe UI;
background:#f2f4f7;
margin:0;
}

.header{
background:#ff6900;
color:white;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.search{
max-width:900px;
margin:auto;
padding:20px;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.container{
max-width:900px;
margin:auto;
padding:0 20px 40px;
}

.card{
background:white;
border-radius:12px;
padding:14px;
margin-bottom:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.judul{
font-weight:bold;
font-size:16px;
color:#ff6900;
}

.row{
font-size:13px;
margin-top:4px;
}

.label{
font-weight:bold;
}

</style></head><body><div class="header">
Analisa Perbaikan Xiaomi (Teknisi)
</div><div class="search">
<input type="text" id="search" placeholder="Cari kerusakan Xiaomi...">
</div><div class="container" id="list"></div><script>

const data=[

{
judul:"Xiaomi Mati Total",
penyebab:"IC Power rusak, baterai drop, short jalur Vbat",
cek:"IC Power, jalur Vbat, baterai",
solusi:"Cek tegangan baterai, cek short motherboard, ganti IC Power"
},

{
judul:"Bootloop / Stuck Logo MI",
penyebab:"Firmware rusak atau eMMC bad sector",
cek:"eMMC, system firmware",
solusi:"Flash ulang firmware MIUI atau ganti eMMC"
},

{
judul:"Tidak Bisa Charging",
penyebab:"Konektor charger rusak atau IC charging rusak",
cek:"USB connector, IC charger",
solusi:"Ganti konektor atau IC charger"
},

{
judul:"Sinyal Hilang",
penyebab:"Baseband error atau IC RF rusak",
cek:"Baseband, antena, IC RF",
solusi:"Flash modem atau cek IC RF"
},

{
judul:"IMEI Null",
penyebab:"NVRAM rusak",
cek:"Baseband",
solusi:"Repair IMEI dengan tool"
},

{
judul:"Wifi Tidak Aktif",
penyebab:"IC WiFi rusak atau firmware error",
cek:"IC WiFi",
solusi:"Reball atau ganti IC WiFi"
},

{
judul:"Bluetooth Tidak Aktif",
penyebab:"IC combo wifi rusak",
cek:"IC wifi / bluetooth",
solusi:"Reball IC"
},

{
judul:"Tidak Ada Suara",
penyebab:"Speaker rusak atau IC audio rusak",
cek:"Speaker, IC audio",
solusi:"Ganti speaker atau IC audio"
},

{
judul:"Layar Blank",
penyebab:"LCD rusak atau jalur display putus",
cek:"LCD, konektor LCD",
solusi:"Ganti LCD"
},

{
judul:"HP Cepat Panas",
penyebab:"CPU overload atau short komponen",
cek:"CPU, jalur power",
solusi:"Cek short motherboard"
},

{
judul:"Restart Sendiri",
penyebab:"Baterai drop atau IC power lemah",
cek:"Baterai, IC power",
solusi:"Ganti baterai"
},

{
judul:"Tidak Ada Getar",
penyebab:"Motor vibrator rusak",
cek:"Motor getar",
solusi:"Ganti vibrator"
},

{
judul:"Kamera Error",
penyebab:"Kamera rusak atau driver rusak",
cek:"Kamera depan / belakang",
solusi:"Ganti kamera"
}

];

function render(list){

const container=document.getElementById("list");
container.innerHTML="";

list.forEach(e=>{

container.innerHTML+=`

<div class="card">

<div class="judul">${e.judul}</div>

<div class="row"><span class="label">Penyebab :</span> ${e.penyebab}</div>

<div class="row"><span class="label">Komponen Dicek :</span> ${e.cek}</div>

<div class="row"><span class="label">Solusi :</span> ${e.solusi}</div>

</div>

`;

});

}

render(data);

document.getElementById("search").addEventListener("keyup",function(){

let q=this.value.toLowerCase();

let result=data.filter(e=>e.judul.toLowerCase().includes(q));

render(result);

});

</script></body>
</html>
