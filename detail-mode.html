<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Detail Mode Xiaomi</title><style>

body{
font-family:Segoe UI;
background:#f2f4f7;
margin:0;
}

.header{
background:#ff6900;
color:white;
padding:18px;
text-align:center;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.title{
font-size:18px;
font-weight:bold;
color:#ff6900;
}

.row{
margin-top:8px;
font-size:14px;
}

.code{
background:#eee;
padding:6px;
border-radius:6px;
margin-top:5px;
display:inline-block;
}

.btn{
margin-top:10px;
display:inline-block;
background:#ff6900;
color:white;
padding:6px 12px;
border-radius:6px;
font-size:13px;
border:none;
cursor:pointer;
}

</style></head><body><div class="header">Detail Mode Xiaomi</div><div class="container">
<div class="card" id="detail">Loading...</div>
</div><script>

/* DATA MODE */

const data = {

"Fastboot Mode":{
fungsi:"Flashing firmware via fastboot",
cara:"Volume Down + Power",
langkah:"Hubungkan ke PC → buka MiFlash → flash ROM",
kode:"fastboot devices"
},

"Recovery Mode":{
fungsi:"Wipe data / update OTA",
cara:"Volume Up + Power",
langkah:"Pilih wipe data atau update",
kode:"apply update"
},

"EDL Mode":{
fungsi:"Unbrick / bypass akun",
cara:"Test point atau adb edl",
langkah:"Gunakan MiFlash",
kode:"adb reboot edl"
},

"ADB Mode":{
fungsi:"Debugging HP",
cara:"Aktifkan USB Debugging",
langkah:"Hubungkan ke PC",
kode:"adb devices"
},

"Test Mode":{
fungsi:"Test hardware",
cara:"Dial *#*#6484#*#*",
langkah:"Cek LCD, sensor dll",
kode:"CIT"
}

};

/* AMBIL PARAMETER URL */

function getMode(){
const params = new URLSearchParams(window.location.search);
return params.get("mode");
}

/* COPY */

function copyText(text){
navigator.clipboard.writeText(text);
alert("Command disalin!");
}

/* RENDER */

const mode = getMode();
const el = document.getElementById("detail");

if(data[mode]){

const d = data[mode];

el.innerHTML = `
<div class="title">${mode}</div>

<div class="row"><b>Fungsi :</b> ${d.fungsi}</div>
<div class="row"><b>Cara Masuk :</b> ${d.cara}</div>
<div class="row"><b>Langkah :</b> ${d.langkah}</div>

<div class="row"><b>Command :</b></div>
<div class="code">${d.kode}</div>

<br>

<button class="btn" onclick="copyText('${d.kode}')">
Copy Command
</button>

`;

}else{
el.innerHTML = "Mode tidak ditemukan";
}

</script></body>
</html>
