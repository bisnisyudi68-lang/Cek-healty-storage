<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Database Model Xiaomi</title><style>

body{
font-family:Segoe UI;
background:#f2f4f7;
margin:0;
}

.header{
background:#ff6900;
color:white;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.search{
max-width:900px;
margin:auto;
padding:20px;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.container{
max-width:900px;
margin:auto;
padding:0 20px 40px;
}

.item{
background:white;
border-radius:12px;
padding:12px;
margin-bottom:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.model{
font-weight:bold;
font-size:16px;
}

.code{
color:#ff6900;
font-weight:bold;
font-size:14px;
}

.info{
font-size:13px;
color:#555;
margin-top:3px;
}

</style></head><body><div class="header">
Database Model Xiaomi
</div><div class="search">
<input type="text" id="search" placeholder="Cari model Xiaomi...">
</div><div class="container" id="list"></div><script>

const phones=[

{model:"Redmi Note 10",code:"M2101K7AG",year:"2021"},
{model:"Redmi Note 10 Pro",code:"M2101K6G",year:"2021"},
{model:"Redmi Note 10S",code:"M2101K7BG",year:"2021"},

{model:"Redmi Note 11",code:"2201117TG",year:"2022"},
{model:"Redmi Note 11 Pro",code:"2201116TG",year:"2022"},
{model:"Redmi Note 11 Pro 5G",code:"21091116UG",year:"2022"},

{model:"Redmi Note 12",code:"22101316G",year:"2023"},
{model:"Redmi Note 12 Pro",code:"22101316UG",year:"2023"},
{model:"Redmi Note 12 Pro+",code:"22101316UG",year:"2023"},

{model:"Redmi Note 13",code:"2312DRAABG",year:"2024"},
{model:"Redmi Note 13 Pro",code:"2312DRA50G",year:"2024"},
{model:"Redmi Note 13 Pro+",code:"2312DRA50G",year:"2024"},

{model:"Redmi 9",code:"M2004J19G",year:"2020"},
{model:"Redmi 10",code:"21061119AG",year:"2021"},
{model:"Redmi 11",code:"22011119UY",year:"2022"},
{model:"Redmi 12",code:"23053RN02G",year:"2023"},

{model:"Poco X3 Pro",code:"M2102J20SG",year:"2021"},
{model:"Poco X4 Pro",code:"2201116PG",year:"2022"},
{model:"Poco X5 Pro",code:"22101320G",year:"2023"},

{model:"Poco F3",code:"M2012K11AG",year:"2021"},
{model:"Poco F4",code:"22021211RG",year:"2022"},
{model:"Poco F5",code:"23013PC75G",year:"2023"},

{model:"Xiaomi 11T",code:"21081111RG",year:"2021"},
{model:"Xiaomi 12",code:"2201123G",year:"2022"},
{model:"Xiaomi 13",code:"2211133G",year:"2023"},
{model:"Xiaomi 14",code:"23127PN0CG",year:"2024"}

];

function render(list){

const container=document.getElementById("list");
container.innerHTML="";

list.forEach(p=>{

container.innerHTML+=`

<div class="item">

<div class="model">${p.model}</div>

<div class="code">${p.code}</div>

<div class="info">Tahun: ${p.year}</div>

</div>

`;

});

}

render(phones);

document.getElementById("search").addEventListener("keyup",function(){

let q=this.value.toLowerCase();

let result=phones.filter(p=>
p.model.toLowerCase().includes(q) ||
p.code.toLowerCase().includes(q)
);

render(result);

});

</script></body>
</html>
