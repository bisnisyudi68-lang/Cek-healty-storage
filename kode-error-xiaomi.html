<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kode Error Xiaomi</title><style>
body{font-family:Segoe UI;background:#f2f4f7;margin:0;}
.header{background:#ff6900;color:white;padding:18px;text-align:center;font-weight:bold;}
.container{max-width:900px;margin:auto;padding:20px;}
.card{background:white;padding:12px;border-radius:10px;margin-bottom:10px;box-shadow:0 3px 10px rgba(0,0,0,0.1);}
.title{font-weight:bold;color:#ff6900;}
.row{font-size:13px;margin-top:4px;}
</style></head><body><div class="header">Kode Error Xiaomi</div>
<div class="container" id="list"></div><script>

const data=[

{judul:"Error 86006",penyebab:"Device belum bind Mi Account",solusi:"Bind device di developer option"},
{judul:"Error 10008",penyebab:"Akun tidak valid",solusi:"Login ulang Mi Account"},
{judul:"Flashing Error",penyebab:"Firmware salah",solusi:"Gunakan firmware sesuai tipe"},
{judul:"Sahara Fail",penyebab:"Loader tidak cocok",solusi:"Ganti firehose loader"},
{judul:"Firehose Error",penyebab:"File corrupt",solusi:"Download ulang firmware"},
{judul:"Device Not Detected",penyebab:"Driver belum terinstall",solusi:"Install driver Qualcomm"}

];

const container=document.getElementById("list");

data.forEach(e=>{
container.innerHTML+=`
<div class="card">
<div class="title">${e.judul}</div>
<div class="row">Penyebab : ${e.penyebab}</div>
<div class="row">Solusi : ${e.solusi}</div>
</div>`;
});

</script></body>
</html>
