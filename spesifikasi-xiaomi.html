function render(list){

list.forEach(p=>{

container.innerHTML+=`

<div class="card">

<img class="img" src="${img}">

<div class="model">${p.model}</div>

<div class="row"><span class="label">Chipset :</span> ${p.chip}</div>

</div>

`;

});

}

render(phones);

document.getElementById("search").addEventListener("keyup",function(){

let q=this.value.toLowerCase();

let result=phones.filter(p=>p.model.toLowerCase().includes(q));

render(result);

});
