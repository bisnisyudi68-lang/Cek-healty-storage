<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kode Rahasia Handphone</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial;
}

body{
background:#f2f4f7;
transition:0.3s;
}

.dark{
background:#121212;
color:white;
}

/* HEADER */

.header{
background:#0d6efd;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
font-size:18px;
}

/* DARK BUTTON */

.dark-btn{
cursor:pointer;
font-size:14px;
}

/* SEARCH */

.search{
padding:15px;
max-width:700px;
margin:auto;
}

.search input{
width:100%;
padding:10px;
border-radius:8px;
border:none;
outline:none;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

/* CONTAINER */

.container{
max-width:900px;
margin:auto;
padding:20px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
padding:10px;
}
/* BRAND */

.brand{
background:white;
padding:22px 10px;
border-radius:18px;
text-align:center;
cursor:pointer;
font-weight:600;
font-size:16px;
box-shadow:0 6px 18px rgba(0,0,0,0.15);
transition:0.2s;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:8px;
}
.brand:hover{
transform:scale(1.05);
background:#0d6efd;
color:white;
}

.brand img{
width:35px;
display:block;
margin:auto;
margin-bottom:6px;
}
.brand{
text-decoration:none;
color:inherit;
}
.brand:active{
transform:scale(0.95);
background:#0d6efd;
color:white;
}
.brand span{
font-size:28px;
}
@media (min-width:900px){

.grid{
grid-template-columns:repeat(6,1fr);
}

.brand{
padding:20px;
font-size:16px;
}

}
/* FOOTER */

.footer{
text-align:center;
margin-top:30px;
font-size:13px;
color:#777;
}

</style>
</head>

<body>

<div class="header">

Kode Rahasia Handphone

<div class="dark-btn" onclick="darkMode()">🌙</div>

</div>

<div class="search">
<input type="text" id="search" placeholder="Cari brand handphone...">
</div>

<div class="container">

<div class="grid">

<a href="samsung.html" class="brand">
<span>📱</span>
Samsung
</a>

<a href="xiaomi.html" class="brand">
<span>📱</span>
Xiaomi
</a>
<a href="vivo.html" class="brand">📱 Vivo</a>
<a href="oppo.html" class="brand">📱 Oppo</a>
<a href="realme.html" class="brand">📱 Realme</a>

<a href="infinix.html" class="brand">📱 Infinix</a>
<a href="tecno.html" class="brand">📱 Tecno</a>
<a href="huawei.html" class="brand">📱 Huawei</a>
<a href="asus.html" class="brand">📱 Asus</a>
<a href="sony.html" class="brand">📱 Sony</a>

<a href="nokia.html" class="brand">📱 Nokia</a>
<a href="motorola.html" class="brand">📱 Motorola</a>

</div>

<div class="footer">

Database kode rahasia teknisi handphone

</div>

</div>

<script>

function darkMode(){

document.body.classList.toggle("dark");

}

/* SEARCH */

const search = document.getElementById("search");

search.addEventListener("keyup",function(){

let filter = search.value.toLowerCase();
let brands = document.querySelectorAll(".brand");

brands.forEach(function(item){

let text = item.innerText.toLowerCase();

if(text.includes(filter)){
item.style.display="block";
}else{
item.style.display="none";
}

});

});

</script>

</body>
</html>
